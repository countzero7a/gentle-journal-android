name: Build APK

# Every push to main builds a signed release APK and publishes it as the
# "latest-build" GitHub Release, so it can be downloaded straight to a phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Also validates gradle-wrapper.jar against Gradle's published checksums
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # gradle.properties is tuned for a 4 GB laptop; CI runners have more room
        run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify signature
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/gentle-journal.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs dist/gentle-journal.apk

      - name: Publish as the latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build dist/gentle-journal.apk \
            --title "Gentle Journal build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On your phone, download gentle-journal.apk and open it to install or update." \
            --target "${{ github.sha }}" \
            --latest

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
